  <title>KOMANDO TAKTIS — OPERATOR</title>

  <style>/* v3.26 layar pembuka instan (tanpa menunggu JS) */
    .pboot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:radial-gradient(120% 90% at 30% 30%,#242220 0%,#131210 46%,#080707 100%);color:#f3efe3;font-family:'Barlow Condensed',system-ui,sans-serif;letter-spacing:.08em;text-align:center}
    .pboot h1{margin:0;font-size:clamp(28px,7vw,56px);font-weight:700}.pboot h1 b{color:#ff9f1c}.pboot-c{color:#ff9f1c;font-size:26px}.pboot-s{opacity:.6;font-size:14px;letter-spacing:.4em}
    .pboot-bar{width:min(240px,50vw);height:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:14px;border-radius:2px}.pboot-bar i{display:block;width:40%;height:100%;background:#ff9f1c;animation:pbl 1.1s ease-in-out infinite}
    .pboot-t{font-size:13px;opacity:.55;letter-spacing:.12em}@keyframes pbl{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  </style>
</head>
<!-- EDISI OFFLINE: hanya mode OPERATOR (FPS). Simulasi warzone tetap berjalan di belakang tanpa layar radar/warzone. -->
<body class="play" data-doc="tni" data-view="fps">

<div id="stage" class="vstage fps">

  <div id="fpsmenu" class="fmenu off"></div>
  <div id="fpspause" class="fmenu off"></div>

  <div id="pover" class="off"></div>
  <div id="protate"></div>
</div>
